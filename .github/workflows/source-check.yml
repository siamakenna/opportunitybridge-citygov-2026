name: Observe sources and publish discovery (no approvals)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve public announcements and build review queue
        run: npm run sources:scan
      - name: Refresh advertised public RSS discovery metadata
        run: npm run pulse:refresh
      - uses: actions/upload-artifact@v7
        with:
          name: official-source-review-queue
          path: |
            evidence/source-observations-latest.json
            evidence/source-review-report.json
            docs/SOURCE_REVIEW_REPORT.md
            data/pulse.json
          retention-days: 7
          if-no-files-found: error

      - uses: actions/configure-pages@v5
      - name: Release blocker — taxonomy regressions
        run: npm run test:classification
      - name: Release blocker — safe journey and source connections
        run: npm run test:journey
      - run: npm test
      - run: npm run sources
      - run: npm run study:build
      - name: Release blocker — reproducible public study kit
        run: git diff --exit-code -- study/participant
      - run: npm run build
      - run: python3 scripts/verify-study-package.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish-snapshot:
    needs: observe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip publication if a newer code release exists
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
