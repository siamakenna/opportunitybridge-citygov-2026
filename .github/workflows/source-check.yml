name: Observe official sources (no approvals)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
permissions:
  contents: read
concurrency:
  group: source-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve public announcements and build review queue
        run: npm run sources:scan
      - uses: actions/upload-artifact@v7
        with:
          name: official-source-review-queue
          path: |
            evidence/source-observations-latest.json
            evidence/source-review-report.json
            docs/SOURCE_REVIEW_REPORT.md
          retention-days: 7
          if-no-files-found: error
