name: Verify and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Release blocker — taxonomy regressions
        run: npm run test:classification
      - name: Release blocker — safe journey and source connections
        run: npm run test:journey
      - run: npm test
      - run: npm run sources
      - run: npm run benchmark
      - run: npm run benchmark:cceb
      - run: npm run pulse:refresh
      - run: npm run study:build
      - name: Release blocker — reproducible public study kit
        run: git diff --exit-code -- study/participant
      - run: npm run build
      - run: python3 scripts/verify-study-package.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
